<!DOCTYPE html>
<html lang="">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="dark only">
  <meta name="darkreader-lock">
  <link rel="icon" href="/favicon.ico">
  <!--
    YouTube Playables SDK. Stripped from every non-YouTube build by
    vite.config.ts. Load-bearing on that one: the Playgama Bridge's `youtube`
    adapter waits for `window.ytgame` with a 100ms poll that has NO timeout,
    so without this tag `bridge.initialize()` never settles. YouTube requires
    it before any game code, hence the position.
  -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!--
    Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
    classic (non-module) tag: module scripts are deferred, so a shim installed
    from inside the module graph would run after the entry chunk's static
    imports have already executed their module-scope `localStorage.getItem`
    calls. YouTube Playables sets `window.localStorage` to null, which is what
    crashed the 2026-09 submission. See public/js/storage-shim.js.
  -->
  <script src="/js/storage-shim.js"></script>
  <!--
    Poki SDK. Stripped from every non-Poki build by vite.config.ts. This is a
    5.5 KB queueing shim that loads a ~325 KB core from the same host; it must
    run before the app so `window.PokiSDK` exists when main.ts evaluates, and
    so `getLanguage()` / `getDeviceInfo()` answer synchronously at boot.
  -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <!-- CSP meta tag injected by vite.config.ts at build time -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16261b">
  <meta name="description" content="Flick cute but angry stuffed-animal smashers across forest clearings, level them up, unlock their skills and smash the enemy Team Tower to win!">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Tree Smashers">
  <meta property="og:description" content="Flick cute but angry stuffed-animal smashers across forest clearings, level them up, unlock their skills and smash the enemy Team Tower to win!">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Tree Smashers">
  <meta name="twitter:description" content="Flick cute but angry stuffed-animal smashers across forest clearings, level them up, unlock their skills and smash the enemy Team Tower to win!">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tree Smashers">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/images/icons/icon_192x192.png">
  <title>Tree Smashers</title>
  <style>
      /* Static splash — renders instantly before any JS loads */
      body {
          margin: 0;
          background: #1a351d;
      }

      /* Mirrors FLogoProgress.vue rule for rule (flat, transform-only pan). */
      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #2f5f35;
          transition: opacity 0.4s ease-out;
      }

      #static-splash.hidden {
          opacity: 0;
          pointer-events: none;
      }

      #static-splash .s-pan {
          position: absolute;
          inset: -240px 0 0 -240px;
          background-image: url('/images/bg/forest-tile.svg');
          background-size: 240px 240px;
          animation: forest-pan 90s linear infinite;
          will-change: transform;
      }

      @keyframes forest-pan {
          to { transform: translate3d(240px, 240px, 0); }
      }

      #static-splash .s-card {
          position: relative;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: clamp(14px, 4vmin, 28px);
          width: min(86vw, 120vh, 560px);
          user-select: none;
          -webkit-user-select: none;
      }

      #static-splash .s-logo {
          margin: 0;
          width: 100%;
          text-align: center;
          display: block;
          font-family: 'Nunito', system-ui, sans-serif;
          font-weight: 900;
          font-size: clamp(2.6rem, min(13vw, 17vh), 5.6rem);
          line-height: 0.95;
          letter-spacing: 0.02em;
          color: #ffd45e;
          -webkit-text-stroke: 0.14em #1e3a21;
          paint-order: stroke fill;
          text-shadow: 0 0.09em 0 #1e3a21;
          transform: rotate(-3deg);
      }

      #static-splash .s-bar {
          position: relative;
          width: 72%;
          height: clamp(14px, 3vmin, 20px);
          border: 3px solid #1e3a21;
          border-radius: 999px;
          background: #24472a;
          box-shadow: 0 4px 0 #1e3a21;
          overflow: hidden;
      }

      #static-splash .s-fill {
          width: 100%;
          height: 100%;
          background: linear-gradient(#fff2b8 0 28%, #ffc93e 28% 100%);
          transform-origin: left center;
          transform: scaleX(0);
          animation: s-creep 3.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
      }

      @keyframes s-creep {
          to { transform: scaleX(0.14); }
      }

      @media (prefers-reduced-motion: reduce) {
          #static-splash .s-pan { animation: none; }
      }
  </style>
</head>
<body>
<!-- Static splash screen — visible before JS loads -->
<link rel="preload" href="/images/bg/forest-tile.svg" as="image" type="image/svg+xml">
<div id="static-splash" aria-hidden="true">
  <div class="s-pan"></div>
  <div class="s-card">
    <!-- Brand wordmark; swap for the painted logo <img> together with LOGO_SRC in FLogoProgress.vue -->
    <div class="s-logo">Tree Smashers</div>
    <div class="s-bar"><div class="s-fill"></div></div>
  </div>
</div>
<!-- Load the SDK before your game code -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
