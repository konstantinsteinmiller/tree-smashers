  <!--
    YouTube Playables SDK. Stripped from every non-YouTube build by
    vite.config.ts. Load-bearing on that one: the Playgama Bridge's `youtube`
    adapter waits for `window.ytgame` with a 100ms poll that has NO timeout,
    so without this tag `bridge.initialize()` never settles. YouTube requires
    it before any game code, hence the position.
  -->
  <script src="https://www.youtube.com/game_api/v1"></script>
  <!--
    Web Storage shim. MUST stay the first of OUR scripts and MUST stay a
    classic (non-module) tag: module scripts are deferred, so a shim installed
    from inside the module graph would run after the entry chunk's static
    imports have already executed their module-scope `localStorage.getItem`
    calls. YouTube Playables sets `window.localStorage` to null, which is what
    crashed the 2026-09 submission. See public/js/storage-shim.js.
  -->
  <script src="/js/storage-shim.js"></script>
  <!--
    Poki SDK. Stripped from every non-Poki build by vite.config.ts. This is a
    5.5 KB queueing shim that loads a ~325 KB core from the same host; it must
    run before the app so `window.PokiSDK` exists when main.ts evaluates, and
    so `getLanguage()` / `getDeviceInfo()` answer synchronously at boot.
  -->
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>

  <title>Tree Smashers</title>
  <style>
      /*
       * ─── Loader CSS — ONE source for two DOMs ─────────────────────────────
       * #static-splash (below, before any JS) and FLogoProgress.vue (after the
       * app mounts) render the SAME classes and both read THIS sheet, so the
       * hand-over shows the same frame; FLogoProgress copies the splash's
       * animation start times so every entrance / idle / pan keeps its phase.
       * Toy-box UI rules (src/assets/css/DESIGN.md): navy #161a40 outlines,
       * flat fills, hard 0-blur shadows, hard-stop gradients only, no blur /
       * glow / radial gradients. Transform + opacity animations only.
       * Entrances fill `backwards` only: their last frame IS the resting
       * style, so the loader can still fade / fly those elements afterwards.
       */
      body {
          margin: 0;
          background: #1a351d;
      }

      #static-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          transition: opacity 0.4s ease-out;
      }

      /* not `.hidden`: Tailwind's .hidden is display:none and kills the fade */
      #static-splash.ts-handed-over {
          opacity: 0;
          pointer-events: none;
      }

      /* ── Backdrop: the key-art scene (tools/loader-art) ──────────────────
         Back → front: banded sky; flat sun rays turning round the logo; two
         cloud decks drifting at two speeds; the flat sun (the calm plate
         behind the logo); a smasher flicked across the sky on its disc; far
         and mid hills swaying in a slow camera dolly (parallax); small
         drifting bits; two giant cartoon trees taking hits IN TIME WITH THE
         LOGO'S HOP (right tree on one landing, left on the next); the forest
         band; the ground; a smasher zooming along it; the foreground
         bushes; big drifting leaves; the impact star behind the logo on
         every third hop. Art = the generated block below (SVG data URIs, or
         the painted webp at its exact pixel size). Transforms + opacity
         only, all compositor-run; reduced motion = the same scene, still.

         PIXEL GRID (render-sharpness rule): a box, tile or offset on a
         fractional device pixel is RESAMPLED, and a resampled edge is a
         soft edge. So every layer sits on whole css px (= whole device px
         at DPR 1 / 2 / 3; round() in the @supports blocks), tiles are
         whole px wide and high, paintings are shown at exactly their file
         pixels ÷ DPR (files are multiples of 12 px), the slow slides move in
         steps of ONE device pixel (steps(), generated per DPR), the detailed
         layers (trees, forest, ground, bushes) hold still except for the hit
         tilt, the camera dolly moves only the flat hill bands, and the
         impact stars flash by opacity alone (no scaling). */
      :root { --ts-dpr: 1; }
      @media (min-resolution: 1.01dppx) { :root { --ts-dpr: 1.25; } }
      @media (min-resolution: 1.26dppx) { :root { --ts-dpr: 1.5; } }
      @media (min-resolution: 1.51dppx) { :root { --ts-dpr: 2; } }
      @media (min-resolution: 2.01dppx) { :root { --ts-dpr: 2.5; } }
      @media (min-resolution: 2.51dppx) { :root { --ts-dpr: 3; } }
      @media (min-resolution: 3.01dppx) { :root { --ts-dpr: 4; } }

      .ts-backdrop {
          position: fixed;
          inset: 0;
          overflow: hidden;
          contain: strict;
          background: linear-gradient(#1f8ae6 0 18%, #34a6f4 18% 36%, #55bff9 36% 52%, #7fd3fc 52%);
      }

      :where(.ts-backdrop) div,
      :where(.ts-backdrop) div::before,
      :where(.ts-backdrop) div::after {
          position: absolute;
          background-repeat: no-repeat;
          background-size: 100% 100%;
          pointer-events: none;
      }

      /* flat low-contrast wedges: they may turn smoothly */
      .ts-rays {
          --d: 170vmax;
          left: 50%;
          top: 42%;
          width: var(--d);
          height: var(--d);
          translate: -50% -50%;
          animation: ts-turn 100s linear infinite;
      }

      /* just big enough to cover the farthest corner while it turns */
      @supports (width: hypot(3px, 4px)) {
          .ts-rays { --d: calc(2 * hypot(50vw, 58vh) + 8px); }
      }

      .ts-sun {
          --s: min(62vmin, 480px);
          left: calc(50% - var(--s) / 2);
          top: calc(42% - var(--s) / 2);
          width: var(--s);
          height: var(--s);
          border-radius: 50%;
          background: #fff8d2;
          box-shadow: 0 0 0 2.4vmin #ffec94, 0 0 0 4.8vmin rgba(255, 255, 255, 0.24);
      }

      /* sideways tiles, --w × --h (generated: whole px, and the slide steps
         one device px at a time) */
      .ts-clouds {
          left: 0;
          width: calc(100% + var(--w));
          height: var(--h);
          background-size: var(--w) var(--h);
          background-repeat: repeat-x;
          animation: ts-slide var(--t) linear infinite;
      }

      .ts-clouds--far { top: 3vh; --t: 160s; }
      .ts-clouds--near { top: 9vh; --t: 85s; }

      /* the camera dolly: only the flat hill bands, amplitude --par by depth */
      .ts-hills {
          left: calc(var(--par) * -1);
          right: calc(var(--par) * -1);
          animation: ts-dolly 26s ease-in-out infinite alternate;
      }

      .ts-hills--far { --h: 50vh; --par: 8px; }
      .ts-hills--mid { --h: 39vh; --par: 16px; }

      .ts-forest,
      .ts-ground {
          left: 0;
          right: 0;
      }

      .ts-forest { --h: 29vh; }
      .ts-ground { --h: 12vh; }

      .ts-hills,
      .ts-forest,
      .ts-ground {
          bottom: 0;
          height: var(--h);
          background-size: var(--w, calc(var(--h) * var(--ar))) var(--h);
          background-repeat: repeat-x;
          background-position: 0 0;
      }

      /* the giant cartoon trees: still, but for a hit every 5.6 s (= 2 logo
         hops), on the landing of SMASHERS' hop — right tree at 3.9 s, left
         at 6.7 s, … Size --tw × --th (a painting: its file px ÷ DPR). */
      .ts-trees { inset: 0; }

      .ts-tree {
          --hit: 1.1s;
          --th: min(max(54vmin, 30vh), 640px);
          --tw: calc(var(--th) * var(--ar));
          --tb: 16vh;
          bottom: var(--tb);
          left: calc(var(--tx) - var(--tw) / 2);
          width: var(--tw);
          height: var(--th);
          transform-origin: 50% 100%;
          animation: ts-tree-hit 5.6s var(--hit) steps(1, end) infinite;
      }

      .ts-tree--l { --hit: 3.9s; --tx: 7%; scale: -1 1; }
      .ts-tree--r { --tx: 93%; }

      @media (min-aspect-ratio: 1/1) {
          .ts-tree--l { --tx: 14%; }
          .ts-tree--r { --tx: 86%; }
      }

      /* tall phones: the bar and tip sit low, so the forest drops and the
         trees shrink to peek over it at the edges, clear of the bar */
      @media (max-aspect-ratio: 3/4) {
          .ts-forest { --h: 22vh; }
          .ts-tree { --tb: 14vh; --th: 42vmin; }
          .ts-tree--l { --tx: 5%; }
          .ts-tree--r { --tx: 95%; }
      }

      .ts-tree::before,
      .ts-tree::after {
          content: '';
          opacity: 0;
      }

      .ts-tree::before {
          left: 2%;
          top: 34%;
          width: 38%;
          aspect-ratio: 1;
          animation: ts-tree-star 5.6s var(--hit) linear infinite;
      }

      .ts-tree::after {
          left: 30%;
          top: 4%;
          width: 66%;
          aspect-ratio: 200 / 160;
          animation: ts-tree-chips 5.6s var(--hit) steps(1, end) infinite;
      }

      /* smashers on spinning discs: one flicked across the sky, one zooming
         along the ground (path = x on the outer box, hop = y on the inner) */
      .ts-zoom {
          left: 0;
          height: var(--zh);
          aspect-ratio: 240 / 180;
          transform: translate3d(-60vw, 0, 0);
      }

      .ts-zoom--sky { top: 8vh; --zh: 10vmin; --hop: ts-fly-y 11s 2.4s infinite; animation: ts-fly-x 11s 2.4s linear infinite; }
      .ts-zoom--ground { bottom: 2.5vh; --zh: 16vmin; --hop: ts-run-y 13s 6.6s infinite; animation: ts-run-x 13s 6.6s linear infinite; }
      .ts-zoom--ground .ts-zoom__body { transform: scaleX(-1); }

      .ts-zoom__hop,
      .ts-zoom__body {
          inset: 0;
      }

      .ts-zoom__hop { animation: var(--hop); }

      .ts-zoom__body::after {
          content: '';
          inset: 0;
      }

      /* the disc: a flat top-view disc squashed into perspective, spinning */
      .ts-zoom__disc {
          z-index: 1;
          left: 38%;
          bottom: -12%;
          width: 62%;
          aspect-ratio: 1;
          transform: scaleY(0.34);
          transform-origin: 50% 100%;
      }

      .ts-zoom__disc::before {
          content: '';
          inset: 0;
          animation: ts-turn 0.45s linear infinite;
      }

      /* the foreground bushes, tucked past both bottom corners (still) */
      .ts-front {
          inset: 0;
          --fh: min(44vmin, 26vw);
          --fw: calc(var(--fh) * var(--ar));
      }

      .ts-front::before,
      .ts-front::after {
          content: '';
          bottom: calc(var(--fh) * -0.16);
          left: calc(var(--fw) * -0.14);
          width: var(--fw);
          height: var(--fh);
      }

      .ts-front::after {
          left: auto;
          right: calc(var(--fw) * -0.14);
          scale: -1 1;
      }

      /* drifting leaves, chips and confetti: a repeating --tile² tile falling
         down-left by exactly one tile per loop, one device px per step */
      .ts-drift {
          left: 0;
          top: calc(var(--tile) * -1);
          width: calc(100% + var(--tile));
          height: calc(100% + var(--tile));
          background-size: var(--tile) var(--tile);
          background-repeat: repeat;
          animation: ts-fall var(--t) linear infinite;
      }

      .ts-drift--far { --t: 34s; }
      .ts-drift--near { --t: 19s; }

      /* the impact star behind the logo, on every third landing of its hop */
      .ts-burst {
          --b: min(92vmin, 700px);
          left: calc(50% - var(--b) / 2);
          top: calc(42% - var(--b) / 2);
          width: var(--b);
          height: var(--b);
          opacity: 0;
          animation: ts-burst 8.4s 3.9s linear infinite;
      }

      /* the pixel grid: whole css px for every box and offset */
      @supports (width: round(1.5px, 1px)) {
          .ts-sun {
              --s: round(min(62vmin, 480px), 2px);
              left: round(calc(50% - var(--s) / 2), 1px);
              top: round(calc(42% - var(--s) / 2), 1px);
              box-shadow: 0 0 0 round(2.4vmin, 1px) #ffec94, 0 0 0 round(4.8vmin, 1px) rgba(255, 255, 255, 0.24);
          }

          .ts-clouds--far { top: round(3vh, 1px); }
          .ts-clouds--near { top: round(9vh, 1px); }
          .ts-hills--far { --h: round(50vh, 1px); }
          .ts-hills--mid { --h: round(39vh, 1px); }
          .ts-forest { --h: round(29vh, 1px); }
          .ts-ground { --h: round(12vh, 1px); }

          .ts-hills,
          .ts-forest,
          .ts-ground {
              background-size: round(var(--w, calc(var(--h) * var(--ar))), 1px) var(--h);
          }

          .ts-tree {
              bottom: round(var(--tb), 1px);
              left: round(calc(var(--tx) - var(--tw) / 2), 1px);
              width: round(var(--tw), 1px);
              height: round(var(--th), 1px);
          }

          .ts-tree::before {
              left: round(calc(var(--tw) * 0.02), 1px);
              top: round(calc(var(--th) * 0.34), 1px);
              width: round(calc(var(--tw) * 0.38), 2px);
              height: round(calc(var(--tw) * 0.38), 2px);
          }

          .ts-tree::after {
              left: round(calc(var(--tw) * 0.3), 1px);
              top: round(calc(var(--th) * 0.04), 1px);
              width: round(calc(var(--tw) * 0.65), 5px);
              height: round(calc(var(--tw) * 0.52), 4px);
          }

          .ts-zoom--sky { top: round(8vh, 1px); }
          .ts-zoom--ground { bottom: round(2.5vh, 1px); }

          .ts-front {
              --fh: round(min(44vmin, 26vw), 1px);
              --fw: round(calc(var(--fh) * var(--ar)), 1px);
          }

          .ts-front::before,
          .ts-front::after {
              bottom: round(calc(var(--fh) * -0.16), 1px);
              left: round(calc(var(--fw) * -0.14), 1px);
          }

          .ts-front::after {
              left: auto;
              right: round(calc(var(--fw) * -0.14), 1px);
          }

          .ts-burst {
              --b: round(min(92vmin, 700px), 2px);
              left: round(calc(50% - var(--b) / 2), 1px);
              top: round(calc(42% - var(--b) / 2), 1px);
          }
      }

      @media (max-aspect-ratio: 3/4) {
          @supports (width: round(1.5px, 1px)) {
              .ts-forest { --h: round(22vh, 1px); }
          }
      }

      .ts-clouds--far { background-image: url("data:image/svg+xml,%3Csvg preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg' width='1400' height='300' viewBox='0 0 1400 300'%3E%3Cdefs%3E%3Cg id='u'%3E%3Ccircle cx='230' cy='133' r='27'/%3E%3Ccircle cx='264' cy='117' r='41'/%3E%3Ccircle cx='306' cy='104' r='51'/%3E%3Ccircle cx='347' cy='123' r='37'/%3E%3Ccircle cx='376' cy='136' r='25'/%3E%3Ccircle cx='302' cy='137' r='34'/%3E%3Ccircle cx='515' cy='198' r='28'/%3E%3Ccircle cx='550' cy='182' r='42'/%3E%3Ccircle cx='592' cy='169' r='51'/%3E%3Ccircle cx='634' cy='189' r='37'/%3E%3Ccircle cx='663' cy='201' r='25'/%3E%3Ccircle cx='588' cy='203' r='35'/%3E%3Ccircle cx='1104' cy='143' r='25'/%3E%3Ccircle cx='1135' cy='128' r='37'/%3E%3Ccircle cx='1173' cy='117' r='46'/%3E%3Ccircle cx='1210' cy='135' r='33'/%3E%3Ccircle cx='1236' cy='146' r='22'/%3E%3Ccircle cx='1169' cy='147' r='31'/%3E%3C/g%3E%3C/defs%3E%3Cuse href='%23u' y='13' fill='%23b9e8ff'/%3E%3Cuse href='%23u' fill='%23fff'/%3E%3C/svg%3E"); }

      /* loader-scene:end */

      @keyframes ts-turn {
          to { transform: rotate(360deg); }
      }

      @keyframes ts-slide {
          to { transform: translate3d(calc(var(--w) * -1), 0, 0); }
      }

      @keyframes ts-dolly {
          from { transform: translate3d(var(--par), 0, 0); }
          to { transform: translate3d(calc(var(--par) * -1), 0, 0); }
      }

      @keyframes ts-fall {
          to { transform: translate3d(calc(var(--tile) * -1), var(--tile), 0); }
      }

      /* the hit: a cartoon jolt on whole-px poses, each held by steps(1)
         (a rotated or sub-pixel tree would be a resampled, soft one) */
      @keyframes ts-tree-hit {
          0%, 49.99% { transform: none; }
          50% { transform: translate(12px, -3px); }
          53% { transform: translate(-7px, 0); }
          56% { transform: translate(4px, -1px); }
          59% { transform: translate(-2px, 0); }
          62%, 100% { transform: none; }
      }

      /* the stars flash by opacity alone: a scaled star is a resampled one */
      @keyframes ts-tree-star {
          0%, 49.9% { opacity: 0; }
          50%, 55% { opacity: 1; }
          61%, 100% { opacity: 0; }
      }

      @keyframes ts-tree-chips {
          0%, 49.99% { opacity: 0; transform: none; }
          50% { opacity: 1; transform: none; }
          54% { opacity: 1; transform: translate(14px, -16px); }
          58% { opacity: 1; transform: translate(26px, -30px); }
          62%, 100% { opacity: 0; transform: translate(26px, -30px); }
      }

      @keyframes ts-fly-x {
          0% { transform: translate3d(-30vw, 0, 0); }
          24%, 100% { transform: translate3d(130vw, 0, 0); }
      }

      @keyframes ts-fly-y {
          0% { transform: translateY(90%) rotate(-16deg); animation-timing-function: cubic-bezier(0.3, 0.6, 0.5, 1); }
          12% { transform: translateY(-20%) rotate(0deg); animation-timing-function: cubic-bezier(0.5, 0, 0.7, 0.4); }
          24%, 100% { transform: translateY(100%) rotate(16deg); }
      }

      @keyframes ts-run-x {
          0% { transform: translate3d(110vw, 0, 0); }
          28%, 100% { transform: translate3d(-40vw, 0, 0); }
      }

      @keyframes ts-run-y {
          0%, 7%, 14%, 21%, 28%, 100% { transform: none; animation-timing-function: ease-out; }
          3.5%, 10.5%, 17.5%, 24.5% { transform: translateY(-24%) rotate(5deg); animation-timing-function: ease-in; }
      }

      @keyframes ts-burst {
          0%, 4% { opacity: 1; }
          9%, 100% { opacity: 0; }
      }

      .ts-stage {
          position: fixed;
          inset: 0;
          box-sizing: border-box;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
      }

      .ts-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: clamp(12px, 3.4vmin, 26px);
          /* the SMASHERS slam shakes the card once */
          animation: ts-shake 0.34s 0.62s linear;
      }

      /* ── Logo lockup: emblem, TREE, SMASHERS (tools/logo/build.mjs) ── */
      .ts-logo {
          position: relative;
          margin: 0;
          width: 100%;
      }

      /* logo-layout:start — generated by tools/logo/build.mjs */
      .ts-card { width: min(84vw, 620px, 44vh * 1.3791); }
      .ts-logo { aspect-ratio: 1084 / 786; }
      .ts-logo__emblem { left: 27.000%; top: 0.000%; width: 46.000%; height: 65.574%; }
      .ts-logo__tree { left: 32.372%; top: 52.459%; width: 35.256%; height: 22.593%; }
      .ts-logo__smashers { left: 0.000%; top: 70.533%; width: 100.000%; height: 29.467%; }
      .ts-logo__shine { -webkit-mask-image: url('/images/logo/word-smashers.svg?v=7cebd1f2'); mask-image: url('/images/logo/word-smashers.svg?v=7cebd1f2'); display: none; }
      /* logo-layout:end */

      .ts-logo__part {
          position: absolute;
      }

      .ts-logo__fly,
      .ts-logo__anim {
          position: relative;
          width: 100%;
          height: 100%;
      }

      .ts-logo__img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: contain;
          -webkit-user-drag: none;
      }

      /* emblem: spins down out of the sky, lands with a squash; idle: rests,
         then flicks round once like a launched disc */
      .ts-logo__anim--emblem {
          animation: ts-emblem-in 0.86s cubic-bezier(0.2, 0.75, 0.3, 1) backwards, ts-emblem-idle 3.6s 1.5s ease-in-out infinite;
      }

      /* the words slam in from big, then hop like the hero CTA's beat */
      .ts-logo__anim--tree {
          animation: ts-slam 0.42s 0.34s cubic-bezier(0.3, 0.7, 0.4, 1) backwards, ts-beat 2.8s 1.4s ease-in-out infinite;
      }

      .ts-logo__anim--smashers {
          animation: ts-slam 0.46s 0.5s cubic-bezier(0.3, 0.7, 0.4, 1) backwards, ts-beat 2.8s 1.52s ease-in-out infinite;
      }

      /* a double shine strip sweeps across SMASHERS (masked by its letters) */
      .ts-logo__shine {
          position: absolute;
          inset: 0;
          overflow: hidden;
          pointer-events: none;
          -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
          -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
      }

      .ts-logo__shine::before {
          content: '';
          position: absolute;
          top: -10%;
          bottom: -10%;
          left: 0;
          width: 24%;
          background: linear-gradient(90deg, transparent 0 14%, rgba(255, 255, 255, 0.7) 14% 48%, transparent 48% 62%, rgba(255, 255, 255, 0.7) 62% 76%, transparent 76%);
          transform: translateX(-130%) skewX(-18deg);
          animation: ts-shine 3.4s 1.1s ease-in-out infinite;
      }

      @keyframes ts-emblem-in {
          0% { opacity: 0; transform: translateY(-70%) scale(0.25) rotate(-540deg); }
          55% { opacity: 1; transform: translateY(6%) scale(1.14) rotate(12deg); }
          76% { transform: translateY(-2%) scale(0.95) rotate(-5deg); }
          100% { opacity: 1; transform: none; }
      }

      @keyframes ts-emblem-idle {
          0%, 62% { transform: none; }
          70% { transform: rotate(-14deg) scale(0.96); }
          86% { transform: rotate(372deg); }
          93% { transform: rotate(357deg) scale(0.99); }
          100% { transform: rotate(360deg); }
      }

      @keyframes ts-slam {
          0% { opacity: 0; transform: scale(2.6) rotate(-6deg); }
          62% { opacity: 1; transform: scale(0.9) rotate(1deg); }
          82% { transform: scale(1.05); }
          100% { opacity: 1; transform: none; }
      }

      /* a hop with a squash: never scaled ABOVE 1 — an upscale would stretch
         the 1× raster of the letters (render-sharpness rule) */
      @keyframes ts-beat {
          0%, 70%, 100% { transform: none; }
          77% { transform: translateY(-6%); }
          85% { transform: translateY(2%) scale(1, 0.95); }
          92% { transform: translateY(-1.5%); }
      }

      @keyframes ts-shake {
          0%, 100% { transform: none; }
          20% { transform: translate(-3px, 4px) rotate(-0.6deg); }
          40% { transform: translate(3px, -3px) rotate(0.5deg); }
          60% { transform: translate(-2px, 2px); }
          80% { transform: translate(1px, -1px); }
      }

      @keyframes ts-shine {
          0% { transform: translateX(-130%) skewX(-18deg); }
          38%, 100% { transform: translateX(470%) skewX(-18deg); }
      }

      /* ── Progress bar: outlined navy track, striped sun fill, 10 notches,
         a spinning mini disc riding the head of the fill ── */
      /* bar + percentage slot (the slot is empty until the app fills it) */
      .ts-meter {
          display: flex;
          align-items: center;
          /* > half the runner disc (0.84 × bar height), so at 100 % it never covers the numerals */
          gap: clamp(26px, 5.6vmin, 36px);
          width: 94%;
          flex: none;
          animation: ts-bar-in 0.4s 0.66s cubic-bezier(0.3, 0.8, 0.4, 1.2) backwards;
      }

      .ts-bar {
          position: relative;
          flex: 1 1 auto;
          height: clamp(24px, 5.2vmin, 34px);
      }

      .ts-bar__track {
          position: absolute;
          inset: 0;
          box-sizing: border-box;
          border: 4px solid #161a40;
          border-radius: 999px;
          background: #10164f;
          box-shadow: inset 0 4px 0 #0b1040, 0 5px 0 #161a40;
          overflow: hidden;
      }

      .ts-bar__fill {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: linear-gradient(#fff7a3 0 24%, #ffd21a 24% 70%, #ffae00 70% 100%);
          transform: translateX(-100%);
          animation: ts-creep-fill 3.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
          will-change: transform;
      }

      .ts-bar__fill::before {
          content: '';
          position: absolute;
          top: 0;
          bottom: 0;
          left: 0;
          right: -46px;
          background: repeating-linear-gradient(-45deg, rgba(255, 255, 255, 0.3) 0 8px, transparent 8px 16px);
          animation: ts-stripes 0.8s linear infinite;
      }

      .ts-bar__notches {
          position: absolute;
          inset: 0;
          background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 3px), rgba(16, 22, 79, 0.6) calc(10% - 3px) 10%);
      }

      .ts-bar__run {
          position: absolute;
          top: 0;
          bottom: 0;
          left: 4px;
          right: 4px;
          pointer-events: none;
          transform: translateX(0);
          animation: ts-creep-run 3.2s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
          will-change: transform;
      }

      .ts-bar__disc {
          position: absolute;
          top: 50%;
          left: 0;
          height: 168%;
          aspect-ratio: 1;
          transform: translate(-50%, -50%);
      }

      .ts-bar__disc::before {
          content: '';
          position: absolute;
          inset: 0;
          border-radius: 50%;
          background: #161a40;
          transform: translateY(3px);
      }

      .ts-bar__disc img {
          position: relative;
          display: block;
          width: 100%;
          height: 100%;
          animation: ts-spin 0.9s linear infinite;
      }

      .ts-pct {
          flex: none;
          width: 3.4em;
          font: 900 clamp(17px, 4.2vmin, 26px) / 1 'Nunito', system-ui, sans-serif;
          font-variant-numeric: tabular-nums;
          letter-spacing: 0.02em;
          white-space: nowrap;
          color: #ffffff;
          -webkit-text-stroke: 0.24em #161a40;
          paint-order: stroke fill;
          text-shadow: 0 0.12em 0 #161a40;
      }

      .ts-tip {
          box-sizing: border-box;
          max-width: 100%;
          min-height: 2.7em;
          padding: 0 4%;
          font: 900 clamp(13px, 3.4vmin, 19px) / 1.35 'Nunito', system-ui, sans-serif;
          color: #ffffff;
          text-align: center;
          -webkit-text-stroke: 0.22em #161a40;
          paint-order: stroke fill;
          text-shadow: 0 0.12em 0 #161a40;
      }

      @keyframes ts-bar-in {
          0% { opacity: 0; transform: translateY(40%) scaleX(0.6); }
          70% { opacity: 1; transform: translateY(-6%) scaleX(1.04); }
          100% { opacity: 1; transform: none; }
      }

      @keyframes ts-creep-fill {
          to { transform: translateX(-86%); }
      }

      @keyframes ts-creep-run {
          to { transform: translateX(14%); }
      }

      @keyframes ts-stripes {
          to { transform: translateX(-22.627px); }
      }

      @keyframes ts-spin {
          to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
          /* the same scene, still: no dolly, drift, turn, hits or riders */
          .ts-backdrop div,
          .ts-backdrop div::before,
          .ts-backdrop div::after,
          .ts-card,
          .ts-logo__anim,
          .ts-logo__shine::before,
          .ts-meter,
          .ts-bar__fill::before,
          .ts-bar__disc img {
              animation: none;
          }

          .ts-logo__shine,
          .ts-zoom,
          .ts-burst,
          .ts-tree::before,
          .ts-tree::after {
              display: none;
          }
      }
  </style>
</head>
