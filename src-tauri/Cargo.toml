[package]
name = "chaos-arena"
version = "1.0.1"
description = "Chaos Arena — casual battle game"
authors = ["Konstantin Steinmiller"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
# Ads: Google AdMob, direct integration, no mediation.
#
# `tauri-plugin-levelplay` (Unity LevelPlay / ironSource) is still on disk at
# plugins/tauri-plugin-levelplay/ but is NOT listed here on purpose. The Tauri
# CLI builds gen/android/tauri.settings.gradle from THIS dependency list, so
# dropping the line is what actually keeps the ironSource + Unity Ads artifacts
# out of the APK/AAB. Re-adding it re-adds those SDKs — read ADS_STATE.md at
# the repo root before you do.
tauri-plugin-admob = { path = "plugins/tauri-plugin-admob" }
