<!DOCTYPE html>
<!--
  DEV-ONLY preview of the skill UI (SkillsIntroScreen, SkillPickerModal,
  SkillRevealOverlay, SkillSlotTile, SkillIcon, SkillHudIcon, the Team-modal
  SKILLS section and the boss-drop chips).

    VITE_APP_FEATURE_SKILLS=true pnpm dev
      →   http://localhost:5173/dev/skills-ui.html
          ?scene=intro     the intro screen (drum-roll build-up, then reveal)  [default]
          ?scene=picker    the skill picker on slot 1
          ?scene=config    the Team modal with its SKILLS section
          ?scene=reveal    the light reveal for a later unlock
          ?scene=sheet     icons, HUD chips, slot tiles, stage / boss-peek chips
          ?static=1        force the FX.low / reduced-motion variant
          ?stage=36        campaign stage (skills unlock from the cleared stage)
          ?coins=240       coin balance
          ?lang=de         another locale
          ?shot=1          no controls (screenshots)

  The flag must be on (`VITE_APP_FEATURE_SKILLS=true`) — useSkills reads it
  as a build literal. Vite serves every .html under the root in dev, but a
  production build only bundles `index.html`, so nothing reachable from here
  ships. tests/skillsUi.test.ts pins that.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chaos Arena — skills UI (dev)</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/dev/skillsUiPreview.ts"></script>
</body>
</html>
