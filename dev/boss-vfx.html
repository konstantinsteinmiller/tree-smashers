<!DOCTYPE html>
<!--
  DEV-ONLY scene for the boss-trait VFX layer (src/use/bosses/bossTraitVfx.ts,
  bosses BW4): every boss effect frozen mid-animation on one canvas, drawn by
  the real module with the real pools. Blades are flat stand-in discs.

    pnpm dev   →   http://localhost:5173/dev/boss-vfx.html
          ?q=high|low          quality tier (FX.low fallback set)         [high]
          ?anim=1              loop the effects instead of a frozen frame
          ?engine=1            the REAL engine (useSpinnerGame) playing the
                               Elemental Court by itself, rendered with render()
            &traits=0|1        strip / keep the boss traits (perf A/B arm)  [1]
            &quality=low|high  the engine's FX tier (useQuality URL override)
            &bench=MS          after a 6 s warm-up, sample MS ms of frame
                               deltas; result JSON in window.__bossVfxBench

  Vite serves every .html under the root in dev; a production build only
  bundles index.html, so nothing here ships.
-->

  <meta name="viewport" content="width=device-width, initial-scale=1">

          margin: 0;
          background: #0b1020;

      }
