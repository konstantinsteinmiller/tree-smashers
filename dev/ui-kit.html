<!DOCTYPE html>
<!--
  DEV-ONLY UI kit sheet (#UX1b): every button tone in every state (idle /
  hover / pressed / disabled / focus), the hero CTA, icon buttons, the
  segmented switch and tabs with their sliding pucks, switches, the slider,
  rarity cards + rarity names, tags, chips, banners and the hold-to-confirm
  button — frozen (no animation, no transition) so a screenshot is stable.

    pnpm dev   →   http://localhost:5173/dev/ui-kit.html
                   ?anim=1     keep the idle animations running (eyeballing)

  The screenshot-diff harness renders each [data-kit-shot] block and compares
  it against tools/ui-kit-diff/baseline/ (pnpm ui:diff, pnpm ui:diff --update).
  Hover / focus are forced by the harness over CDP (CSS.forcePseudoState on
  [data-kit-hover] / [data-kit-focus]); pressed and disabled are the real
  `.is-pressed` / `.is-disabled` classes the game uses.

  Vite serves every .html under the root in dev, but a production build only
  bundles index.html, so nothing reachable from here ships.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <title>Tree Smashers — UI kit (dev)</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/dev/uiKitPreview.ts"></script>
</body>
</html>
