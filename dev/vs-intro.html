<!DOCTYPE html>
<!--
  DEV-ONLY preview of the VS intro (VsIntro.vue) — the 5 s face-off before
  a new matchup — with fixture teams.

    pnpm dev  →  http://localhost:5173/dev/vs-intro.html
      ?scene=2v2      2 vs 2 smashers, skills on both sides       [default]
      ?scene=1v1      1 vs 1
      ?scene=3v4      3 vs 4 (the densest layout)
      ?scene=boss     campaign boss stage: boss + minion, trait, crown
      ?scene=campaign 2 vs 3 campaign enemies (no enemy skills)
      ?mode=pvp       force the PvP mode (no skip pill)
      ?at=720         freeze the screen at 720 ms (screenshots)
      ?low=1          the low-render-quality variant
      ?lang=de        another locale
      ?loop=1         replay every 5.4 s

  Vite serves every .html under the root in dev, but a production build only
  bundles `index.html`, so nothing reachable from here ships.
-->
